{
  "profile_id": "maglev-core-v1",
  "layout_version": 1,
  "profile_scope": "maglev",
  "root_entries": [
    "00_profile.yaml",
    "README.md",
    "INDEX.md",
    "glossary.md",
    "positioning.md"
  ],
  "domains": [
    "collaboration-lifecycle",
    "governance-quality",
    "reality-knowledge",
    "skill-runtime",
    "delivery-runtime",
    "adoption-integration",
    "capability-evolution"
  ],
  "domain_policy": "business_evidence",
  "domain_registry": {
    "collaboration-lifecycle": {
      "boundary_reason": "协作角色、生命周期和协同编排共同定义协作行为边界。",
      "boundary_basis": ["user_task", "workflow"],
      "evidence_refs": [".agents/private-catalog.yaml"]
    },
    "governance-quality": {
      "boundary_reason": "需求、审计、验证和质量门禁共同定义质量治理边界。",
      "boundary_basis": ["workflow", "operational_responsibility"],
      "evidence_refs": [".agents/private-catalog.yaml"]
    },
    "reality-knowledge": {
      "boundary_reason": "Reality、索引和上下文入口共同定义现状知识边界。",
      "boundary_basis": ["product_outcome", "operational_responsibility"],
      "evidence_refs": [".agents/private-catalog.yaml"]
    },
    "skill-runtime": {
      "boundary_reason": "技能注册、加载和运行协议共同定义技能运行边界。",
      "boundary_basis": ["workflow", "operational_responsibility"],
      "evidence_refs": [".agents/private-catalog.yaml"]
    },
    "delivery-runtime": {
      "boundary_reason": "安装、更新、构建和发布共同定义交付运行边界。",
      "boundary_basis": ["workflow", "operational_responsibility"],
      "evidence_refs": [".agents/private-catalog.yaml"]
    },
    "adoption-integration": {
      "boundary_reason": "存量接入、初始化和外部适配共同定义接入边界。",
      "boundary_basis": ["user_task", "workflow"],
      "evidence_refs": [".agents/private-catalog.yaml"]
    },
    "capability-evolution": {
      "boundary_reason": "竞品观测、扩展演进和能力注册共同定义能力进化边界。",
      "boundary_basis": ["product_outcome", "workflow"],
      "evidence_refs": [".agents/private-catalog.yaml"]
    }
  },
  "domain_entry_files": [
    "README.md",
    "capability/INDEX.md",
    "implementation/INDEX.md",
    "interfaces/INDEX.md",
    "operations/INDEX.md",
    "verification/INDEX.md",
    "evidence/INDEX.md"
  ],
  "crosscutting_entry_files": [
    "README.md",
    "repository-map/INDEX.md",
    "interfaces/INDEX.md",
    "evidence/INDEX.md",
    "risks/INDEX.md"
  ],
  "knowledge_statuses": [
    "established",
    "unknown",
    "not_established",
    "not_applicable"
  ],
  "slot_entry_contract": {
    "required_fields": [
      "knowledge_status",
      "evidence_refs"
    ],
    "not_applicable_requires_evidence": true
  },
  "document_registry": {
    "scope": "additional_markdown_pages_only",
    "required_fields": [
      "path",
      "owner_domain",
      "owner_slot",
      "purpose",
      "knowledge_status",
      "evidence_refs"
    ],
    "owner_slots": [
      "capability",
      "implementation",
      "interfaces",
      "operations",
      "verification",
      "evidence"
    ],
    "crosscutting_slots": [
      "repository-map",
      "interfaces",
      "evidence",
      "risks"
    ],
    "not_applicable_requires_evidence": true
  },
  "state_file_registry": {
    "required_fields": [
      "path",
      "owner_domain",
      "owner_slot",
      "purpose"
    ],
    "owner_slots": [
      "capability",
      "implementation",
      "interfaces",
      "operations",
      "verification",
      "evidence"
    ]
  },
  "documents": [],
  "state_files": [],
  "index": {
    "track_id": "specs",
    "owner": "index-librarian",
    "manual_index_writes": false
  },
  "extension_policy": {
    "requires_profile_version_bump": true,
    "requires_migration": true
  },
  "migration": {
    "state": "not_required",
    "legacy_paths": []
  }
}
